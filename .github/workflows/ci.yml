name: ci

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The same Python and the same pinned packages the production image uses.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # Without ffmpeg the real audio/video tests are skipped rather than run.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.lock pytest

      - name: Unit tests (offline, no API keys needed)
        run: python -m pytest -q

  image:
    # Proves the production image still builds on every change, without pushing it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
